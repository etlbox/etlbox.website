{{ define "main" }}
<div class="row justify-content-center">
  <main class="col-lg-8">
    <div class="page-header mb-4">
      <p class="experts-kicker">Get in touch</p>
      <h1>{{ .Title }}</h1>
      {{ with .Params.lead -}}
      <p class="lead">{{ . | safeHTML }}</p>
      {{ end -}}
    </div>
    {{ .Content }}
  </main>
</div>
{{ end }}
