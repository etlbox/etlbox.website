# Module Configuration File
#
# This file configures Hugo module settings, particularly module mounts which
# define how content is organized within the project.
#
# Mounts specify file paths in your project that Hugo should use when building
# the site. They allow for custom directory structures and integrating content
# from different locations.

## content
[[mounts]]
  source = "directsync/content"
  target = "content"

# Shared legal + purchase pages — product trees do not inherit default content/
[[mounts]]
  source = "content/support/eula"
  target = "content/support/eula"

[[mounts]]
  source = "content/support/contact/purchase.md"
  target = "content/support/contact/purchase.md"

## data
[[mounts]]
  source = "node_modules/@thulite/doks-core/data"
  target = "data"

[[mounts]]
  source = "data"
  target = "data"

## layouts
# Mount the DirectSync home page first so it wins over layouts/home.html.
[[mounts]]
  source = "directsync/layouts"
  target = "layouts"

[[mounts]]
  files = ['! home.html']
  source = "layouts"
  target = "layouts"

[[mounts]]
  files = ['! home.html']
  source = "node_modules/@thulite/doks-core/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@thulite/core/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@thulite/seo/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@thulite/images/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@thulite/inline-svg/layouts"
  target = "layouts"

