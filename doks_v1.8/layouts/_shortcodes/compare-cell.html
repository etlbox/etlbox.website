{{- $yes := eq (.Get 0) "yes" -}}
{{- $note := .Get 1 -}}
<div class="d-flex flex-column align-items-center gap-1">
  {{- if $yes -}}
  <i class="bi bi-check-circle-fill compare-yes fs-3 lh-1" aria-label="Yes"></i>
  {{- else -}}
  <i class="bi bi-x-circle-fill compare-no fs-3 lh-1" aria-label="No"></i>
  {{- end -}}
  {{- with $note -}}
  <span class="small fw-medium text-secondary">{{ . }}</span>
  {{- end -}}
</div>
